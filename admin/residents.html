<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Resident Directory | Happy Living Admin</title>
    <link rel="stylesheet" href="../css/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        .dashboard-container {
            display: flex;
            min-height: 100vh;
        }

        .sidebar {
            width: 260px;
            background: rgba(255, 255, 255, 0.9);
            backdrop-filter: blur(10px);
            border-right: 1px solid rgba(0, 0, 0, 0.05);
            padding: 2rem;
            position: fixed;
            height: 100vh;
            overflow-y: auto;
            z-index: 100;
        }

        .main-content {
            margin-left: 260px;
            flex: 1;
            padding: 2rem;
        }

        .nav-item {
            display: flex;
            align-items: center;
            gap: 1rem;
            padding: 1rem;
            color: var(--text-muted);
            border-radius: var(--radius-md);
            margin-bottom: 0.5rem;
            cursor: pointer;
        }

        .nav-item:hover,
        .nav-item.active {
            background: rgba(79, 70, 229, 0.05);
            color: var(--primary);
        }

        .resident-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 1.5rem;
            margin-top: 2rem;
        }

        .resident-card {
            background: white;
            padding: 1.5rem;
            border-radius: var(--radius-lg);
            box-shadow: var(--shadow-sm);
            border: 1px solid rgba(0, 0, 0, 0.05);
            transition: all 0.3s ease;
        }

        .resident-card:hover {
            transform: translateY(-5px);
            box-shadow: var(--shadow-md);
            border-color: var(--primary);
        }

        .resident-header {
            display: flex;
            align-items: center;
            gap: 1rem;
            margin-bottom: 1rem;
        }

        .resident-avatar {
            width: 50px;
            height: 50px;
            border-radius: 50%;
            background: var(--primary);
            color: white;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.25rem;
            font-weight: 700;
        }

        .resident-info p {
            font-size: 0.9rem;
            color: var(--text-muted);
            margin-bottom: 0.25rem;
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .resident-info i {
            width: 16px;
            text-align: center;
            color: var(--primary);
        }

        .filter-bar {
            background: white;
            padding: 1rem;
            border-radius: var(--radius-md);
            margin-bottom: 2rem;
            display: flex;
            gap: 1rem;
            flex-wrap: wrap;
            align-items: center;
            box-shadow: var(--shadow-sm);
        }

        .search-input {
            flex: 1;
            min-width: 250px;
            padding: 0.75rem 1rem;
            border: 1px solid #e2e8f0;
            border-radius: var(--radius-md);
            font-family: inherit;
        }

        @media (max-width: 900px) {
            .dashboard-container {
                flex-direction: column;
            }

            .sidebar {
                width: 100%;
                height: auto;
                position: relative;
                padding: 1rem;
                border-right: none;
                border-bottom: 1px solid rgba(0, 0, 0, 0.05);
            }

            .main-content {
                margin-left: 0;
                padding: 1rem;
            }

            .sidebar-nav {
                display: flex;
                overflow-x: auto;
                gap: 0.5rem;
            }

            .nav-item {
                margin-bottom: 0;
                white-space: nowrap;
            }
        }
    </style>
</head>

<body>
    <div class="dashboard-container">
        <!-- Sidebar -->
        <aside class="sidebar">
            <div class="logo" style="margin-bottom: 2rem;">
                <img src="../assets/logo.jpg" alt="Logo" style="height: 30px;">
                Happy Living
            </div>
            <nav class="sidebar-nav">
                <div class="nav-item" onclick="window.location.href='dashboard.html'">
                    <i class="fa-solid fa-gauge"></i> Dashboard
                </div>
                <div class="nav-item active">
                    <i class="fa-solid fa-users"></i> Residents
                </div>
                <div class="nav-item" onclick="window.location.href='dashboard.html?section=rooms-section'">
                    <i class="fa-solid fa-bed"></i> Rooms
                </div>
                <div class="nav-item" onclick="window.location.href='dashboard.html?section=complaints-section'">
                    <i class="fa-solid fa-circle-exclamation"></i> Complaints
                </div>
                <div class="nav-item" onclick="Auth.logout()">
                    <i class="fa-solid fa-right-from-bracket"></i> Logout
                </div>
            </nav>
        </aside>

        <!-- Main Content -->
        <main class="main-content">
            <header style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 2rem;">
                <div>
                    <h1 style="font-size: 1.8rem;">Resident Directory</h1>
                    <p style="color: var(--text-muted);">Manage and view all registered residents</p>
                </div>
                <button class="btn btn-primary"
                    onclick="window.location.href='dashboard.html?section=add-resident-section'">
                    <i class="fa-solid fa-plus"></i> Add New Resident
                </button>
            </header>

            <div class="filter-bar">
                <input type="text" class="search-input" id="searchResidents"
                    placeholder="Search by name, email, or room..." oninput="renderResidents()">
                <select id="pgFilter" class="form-input" style="width: auto;" onchange="renderResidents()">
                    <option value="all">All PGs</option>
                </select>
                <div style="color: var(--text-muted); font-size: 0.9rem;">
                    Total: <strong id="totalCount">0</strong>
                </div>
            </div>

            <div id="residentGrid" class="resident-grid">
                <!-- Populated by JS -->
            </div>
        </main>
    </div>

    <script src="../js/data.js"></script>
    <script src="../js/auth-service.js"></script>
    <script src="../js/main.js"></script>
    <script>
        Auth.checkAuth('admin');

        function populatePGFilters() {
            const PGs = getData.PGs();
            const select = document.getElementById('pgFilter');
            PGs.forEach(pg => {
                const option = document.createElement('option');
                option.value = pg.name;
                option.textContent = pg.name;
                select.appendChild(option);
            });
        }

        function renderResidents() {
            const bookings = JSON.parse(localStorage.getItem('bookings') || '[]');
            const allocations = getData.Allocations();
            const searchTerm = document.getElementById('searchResidents').value.toLowerCase();
            const pgFilter = document.getElementById('pgFilter').value;

            // Merge details
            const residents = bookings.map(b => {
                const alloc = allocations.find(a => a.student === b.studentName);
                return {
                    name: b.studentName,
                    email: b.email,
                    phone: b.phone || 'N/A',
                    pg: b.pgName,
                    room: alloc ? alloc.room : (b.roomNumber || 'Unassigned'),
                    sharing: b.sharing,
                    status: b.status,
                    date: b.bookingDate
                };
            }).filter(r => {
                const matchesSearch = r.name.toLowerCase().includes(searchTerm) ||
                    r.email.toLowerCase().includes(searchTerm) ||
                    r.room.toLowerCase().includes(searchTerm);
                const matchesPG = pgFilter === 'all' || r.pg === pgFilter;
                return matchesSearch && matchesPG;
            });

            const grid = document.getElementById('residentGrid');
            document.getElementById('totalCount').textContent = residents.length;

            if (residents.length === 0) {
                grid.innerHTML = '<div style="grid-column: 1/-1; text-align: center; padding: 4rem; color: var(--text-muted);">No residents found matching your criteria.</div>';
                return;
            }

            grid.innerHTML = residents.map(r => `
                <div class="resident-card">
                    <div class="resident-header">
                        <div class="resident-avatar">
                            ${r.name.charAt(0)}
                        </div>
                        <div>
                            <h3 style="margin: 0; font-size: 1.1rem;">${r.name}</h3>
                            <span class="status-badge status-paid" style="font-size: 0.75rem;">${r.status}</span>
                        </div>
                    </div>
                    <div class="resident-info">
                        <p><i class="fa-solid fa-envelope"></i> ${r.email}</p>
                        <p><i class="fa-solid fa-phone"></i> ${r.phone}</p>
                        <p><i class="fa-solid fa-building"></i> ${r.pg}</p>
                        <p><i class="fa-solid fa-door-open"></i> Room: ${r.room} (${r.sharing})</p>
                        <p><i class="fa-solid fa-calendar-day"></i> Booked: ${new Date(r.date).toLocaleDateString()}</p>
                    </div>
                    <div style="margin-top: 1.5rem; display: flex; gap: 0.5rem;">
                        <button class="btn btn-secondary" style="flex: 1; padding: 0.5rem;" onclick="viewHistory('${r.email}')">History</button>
                        <button class="btn btn-secondary" style="flex: 1; padding: 0.5rem;" onclick="editResident('${r.email}')">Edit</button>
                    </div>
                </div>
            `).join('');
        }

        function viewHistory(email) {
            alert('Viewing transaction history for: ' + email);
        }

        function editResident(email) {
            alert('Edit functionality for: ' + email + ' (Admin restricted)');
        }

        // Initialize
        populatePGFilters();
        renderResidents();
    </script>
</body>

</html>
