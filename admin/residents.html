<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Resident Directory | Happy Living Admin</title>
    <link rel="stylesheet" href="../css/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --bg-deep: #020617;
            --bg-slate: #0f172a;
            --cyber-cyan: #00f2fe;
            --accent: #c084fc;
            --secondary: #fb7185;
            --radius-lg: 16px;
            --radius-md: 12px;
        }

        body {
            background-color: var(--bg-deep);
            color: white;
            font-family: 'Inter', system-ui, -apple-system, sans-serif;
            margin: 0;
            overflow-x: hidden;
        }

        .mesh-bg {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background:
                radial-gradient(circle at 0% 0%, rgba(0, 242, 254, 0.05) 0%, transparent 50%),
                radial-gradient(circle at 100% 100%, rgba(192, 132, 252, 0.05) 0%, transparent 50%),
                radial-gradient(circle at 50% 50%, rgba(2, 6, 23, 1) 0%, rgba(1, 2, 5, 1) 100%);
            z-index: -5;
        }

        .dashboard-container {
            display: flex;
            min-height: 100vh;
            position: relative;
            z-index: 1;
        }

        .sidebar {
            width: 260px;
            background: rgba(15, 23, 42, 0.8);
            backdrop-filter: blur(20px);
            border-right: 1px solid rgba(255, 255, 255, 0.1);
            padding: 2rem;
            position: fixed;
            height: 100vh;
            overflow-y: auto;
            z-index: 100;
        }

        .main-content {
            margin-left: 260px;
            flex: 1;
            padding: 3rem;
        }

        .logo {
            display: flex;
            align-items: center;
            gap: 0.75rem;
            font-weight: 800;
            font-size: 1.25rem;
            color: white;
            margin-bottom: 3rem;
            text-shadow: 0 0 15px rgba(255, 255, 255, 0.2);
        }

        .nav-item {
            display: flex;
            align-items: center;
            gap: 1rem;
            padding: 1rem;
            color: rgba(255, 255, 255, 0.6);
            border-radius: var(--radius-md);
            margin-bottom: 0.5rem;
            cursor: pointer;
            transition: all 0.3s ease;
            font-weight: 500;
        }

        .nav-item:hover {
            color: white;
            background: rgba(255, 255, 255, 0.05);
        }

        .nav-item.active {
            background: rgba(0, 242, 254, 0.1);
            color: var(--cyber-cyan);
            border: 1px solid rgba(0, 242, 254, 0.2);
            box-shadow: 0 0 20px rgba(0, 242, 254, 0.1);
        }

        .resident-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
            gap: 2rem;
            margin-top: 2rem;
        }

        .resident-card {
            background: rgba(15, 23, 42, 0.7);
            backdrop-filter: blur(20px);
            padding: 2rem;
            border-radius: var(--radius-lg);
            border: 1px solid rgba(255, 255, 255, 0.1);
            transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
            position: relative;
            overflow: hidden;
        }

        .resident-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 4px;
            height: 100%;
            background: var(--cyber-cyan);
            opacity: 0.5;
        }

        .resident-card:hover {
            transform: translateY(-8px);
            border-color: var(--cyber-cyan);
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.5), 0 0 20px rgba(0, 242, 254, 0.1);
        }

        .resident-avatar {
            width: 55px;
            height: 55px;
            border-radius: 12px;
            background: linear-gradient(135deg, #1e293b, #0f172a);
            border: 2px solid rgba(0, 242, 254, 0.3);
            color: var(--cyber-cyan);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.5rem;
            font-weight: 800;
            box-shadow: 0 0 15px rgba(0, 242, 254, 0.2);
        }

        .resident-info p {
            font-size: 0.95rem;
            color: rgba(255, 255, 255, 0.8);
            margin-bottom: 0.75rem;
            display: flex;
            align-items: center;
            gap: 0.75rem;
            text-shadow: 0 1px 2px rgba(0, 0, 0, 0.5);
        }

        .resident-info i {
            width: 20px;
            text-align: center;
            color: var(--cyber-cyan);
            font-size: 1rem;
        }

        .filter-bar {
            background: rgba(15, 23, 42, 0.6);
            backdrop-filter: blur(20px);
            padding: 1.5rem;
            border-radius: var(--radius-lg);
            margin-bottom: 3rem;
            display: flex;
            gap: 1.5rem;
            flex-wrap: wrap;
            align-items: center;
            border: 1px solid rgba(255, 255, 255, 0.1);
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
        }

        .search-input,
        .form-select {
            background: rgba(2, 6, 23, 0.8) !important;
            border: 1px solid rgba(255, 255, 255, 0.15) !important;
            color: white !important;
            padding: 0.8rem 1.2rem;
            border-radius: var(--radius-md);
            font-family: inherit;
            transition: all 0.3s ease;
        }

        .search-input:focus,
        .form-select:focus {
            border-color: var(--cyber-cyan) !important;
            box-shadow: 0 0 15px rgba(0, 242, 254, 0.2) !important;
            outline: none;
        }

        /* Global Visibility Enhancements - Premium Luminous */
        h1,
        h2,
        h3,
        h4,
        label,
        strong {
            color: white !important;
            text-shadow: 0 2px 4px rgba(0, 0, 0, 0.8), 0 0 20px rgba(0, 242, 254, 0.3) !important;
        }

        p {
            color: rgba(255, 255, 255, 0.95) !important;
            text-shadow: 0 1px 3px rgba(0, 0, 0, 0.6) !important;
        }

        h2 {
            font-size: 2.2rem;
            margin-bottom: 2rem;
            background: linear-gradient(90deg, #fff, var(--cyber-cyan), #fff);
            background-size: 200% auto;
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
            filter: drop-shadow(0 0 15px rgba(0, 242, 254, 0.5));
            animation: shine 3s linear infinite;
        }

        @keyframes shine {
            to {
                background-position: 200% center;
            }
        }

        .btn-history {
            background: rgba(0, 242, 254, 0.1);
            color: var(--cyber-cyan);
            border: 1px solid rgba(0, 242, 254, 0.3);
        }

        .btn-edit {
            background: rgba(255, 255, 255, 0.05);
            color: white;
            border: 1px solid rgba(255, 255, 255, 0.15);
        }

        @media (max-width: 900px) {
            .sidebar {
                width: 100%;
                height: auto;
                position: relative;
            }

            .main-content {
                margin-left: 0;
            }
        }
    </style>
</head>

<body>
    <div class="mesh-bg"></div>

    <div class="dashboard-container">
        <!-- Sidebar -->
        <aside class="sidebar">
            <div class="logo">
                <img src="../assets/logo.jpg" alt="Logo" style="height: 35px; border-radius: 6px;">
                Happy Living
            </div>
            <nav class="sidebar-nav">
                <div class="nav-item" onclick="window.location.href='dashboard.html'">
                    <i class="fa-solid fa-gauge"></i> Dashboard
                </div>
                <div class="nav-item active">
                    <i class="fa-solid fa-users"></i> Residents
                </div>
                <div class="nav-item" onclick="window.location.href='dashboard.html?section=rooms-section'">
                    <i class="fa-solid fa-bed"></i> Rooms
                </div>
                <div class="nav-item" onclick="window.location.href='dashboard.html?section=complaints-section'">
                    <i class="fa-solid fa-circle-exclamation"></i> Complaints
                </div>
                <div class="nav-item" onclick="Auth.logout()" style="margin-top: 2rem; color: var(--secondary);">
                    <i class="fa-solid fa-right-from-bracket"></i> Logout
                </div>
            </nav>
        </aside>

        <!-- Main Content -->
        <main class="main-content">
            <header style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 3rem;">
                <div>
                    <h1
                        style="font-size: 2.5rem; margin: 0; background: linear-gradient(90deg, #fff, var(--cyber-cyan)); -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: transparent;">
                        Resident Directory</h1>
                    <p style="margin-top: 0.5rem; font-size: 1.1rem;">Manage and view all registered residents</p>
                </div>
                <button class="btn btn-primary"
                    style="padding: 1rem 1.5rem; font-weight: 700; box-shadow: 0 0 20px rgba(0, 242, 254, 0.3);"
                    onclick="window.location.href='dashboard.html?section=add-resident-section'">
                    <i class="fa-solid fa-plus"></i> ADD RESIDENT
                </button>
            </header>

            <div class="filter-bar">
                <div style="flex: 1; position: relative;">
                    <i class="fa-solid fa-search"
                        style="position: absolute; left: 1.2rem; top: 50%; transform: translateY(-50%); color: rgba(255,255,255,0.4);"></i>
                    <input type="text" class="search-input" id="searchResidents"
                        style="padding-left: 3rem; width: 100%; box-sizing: border-box;"
                        placeholder="Search by name, email, or room..." oninput="renderResidents()">
                </div>
                <select id="pgFilter" class="form-select" style="min-width: 200px;" onchange="renderResidents()">
                    <option value="all">All PG Properties</option>
                </select>
                <div
                    style="color: white; font-weight: 600; background: rgba(0, 242, 254, 0.1); padding: 0.8rem 1.2rem; border-radius: var(--radius-md); border: 1px solid rgba(0, 242, 254, 0.3);">
                    Total: <span id="totalCount" style="color: var(--cyber-cyan);">0</span>
                </div>
            </div>

            <div id="residentGrid" class="resident-grid">
                <!-- Populated by JS -->
            </div>
        </main>
    </div>

    <script src="../js/data.js"></script>
    <script src="../js/auth-service.js"></script>
    <script src="../js/main.js"></script>
    <script>
        Auth.checkAuth('admin');

        function populatePGFilters() {
            const PGs = getData.PGs();
            const select = document.getElementById('pgFilter');
            PGs.forEach(pg => {
                const option = document.createElement('option');
                option.value = pg.name;
                option.textContent = pg.name;
                select.appendChild(option);
            });
        }

        function renderResidents() {
            const bookings = JSON.parse(localStorage.getItem('bookings') || '[]');
            const allocations = getData.Allocations();
            const searchTerm = document.getElementById('searchResidents').value.toLowerCase();
            const pgFilter = document.getElementById('pgFilter').value;

            // Merge details
            const residents = bookings.map(b => {
                const alloc = allocations.find(a => a.student === b.studentName);
                return {
                    name: b.studentName,
                    email: b.email,
                    phone: b.phone || 'N/A',
                    pg: b.pgName,
                    room: alloc ? alloc.room : (b.roomNumber || 'Unassigned'),
                    sharing: b.sharing,
                    status: b.status,
                    date: b.bookingDate
                };
            }).filter(r => {
                const matchesSearch = r.name.toLowerCase().includes(searchTerm) ||
                    r.email.toLowerCase().includes(searchTerm) ||
                    r.room.toLowerCase().includes(searchTerm);
                const matchesPG = pgFilter === 'all' || r.pg === pgFilter;
                return matchesSearch && matchesPG;
            });

            const grid = document.getElementById('residentGrid');
            document.getElementById('totalCount').textContent = residents.length;

            if (residents.length === 0) {
                grid.innerHTML = '<div style="grid-column: 1/-1; text-align: center; padding: 4rem; color: var(--text-muted);">No residents found matching your criteria.</div>';
                return;
            }

            grid.innerHTML = residents.map(r => `
                <div class="resident-card">
                    <div style="display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 1.5rem;">
                        <div class="resident-avatar">
                            ${r.name.charAt(0)}
                        </div>
                        <span class="status-badge" style="background: rgba(0, 242, 254, 0.1); color: var(--cyber-cyan); border: 1px solid rgba(0, 242, 254, 0.3); padding: 0.4rem 0.8rem; border-radius: 8px; font-size: 0.75rem; font-weight: 700; text-transform: uppercase;">${r.status}</span>
                    </div>
                    <div>
                        <h3 style="margin: 0 0 1rem 0; font-size: 1.3rem; letter-spacing: 0.5px;">${r.name}</h3>
                    </div>
                    <div class="resident-info">
                        <p><i class="fa-solid fa-envelope"></i> ${r.email}</p>
                        <p><i class="fa-solid fa-phone"></i> ${r.phone}</p>
                        <p><i class="fa-solid fa-building"></i> ${r.pg}</p>
                        <p><i class="fa-solid fa-door-open"></i> Room: <span style="color: var(--cyber-cyan); font-weight: 600;">${r.room}</span> (${r.sharing})</p>
                        <p><i class="fa-solid fa-calendar-day"></i> Booked: <span style="opacity: 0.8;">${new Date(r.date).toLocaleDateString()}</span></p>
                    </div>
                    <div style="margin-top: 2rem; display: flex; gap: 1rem;">
                        <button class="btn btn-history" style="flex: 1; padding: 0.8rem; font-weight: 600; border-radius: 10px; cursor: pointer;" onclick="viewHistory('${r.email}')">History</button>
                        <button class="btn btn-edit" style="flex: 1; padding: 0.8rem; font-weight: 600; border-radius: 10px; cursor: pointer;" onclick="editResident('${r.email}')">Edit</button>
                    </div>
                </div>
            `).join('');
        }

        function viewHistory(email) {
            alert('Viewing transaction history for: ' + email);
        }

        function editResident(email) {
            alert('Edit functionality for: ' + email + ' (Admin restricted)');
        }



        // Initialize
        populatePGFilters();
        renderResidents();
    </script>
</body>

</html>
