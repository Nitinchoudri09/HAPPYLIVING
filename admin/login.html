<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Login | Happy Living</title>
    <link rel="stylesheet" href="../css/style.css?v=1.1">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>

<body>
    <div class="split-screen">
        <div class="split-left bg-pg-room animate-fade-in">
            <div class="split-content">
                <h1 style="font-size: 3rem; margin-bottom: 1rem;">Admin Portal</h1>
                <p style="font-size: 1.2rem; opacity: 0.9;">Efficient Management & Seamless Control</p>
                <div style="margin-top: 2rem; display: flex; gap: 1rem; justify-content: center;">
                    <span
                        style="background: rgba(255,255,255,0.2); padding: 0.5rem 1rem; border-radius: 20px; font-size: 0.9rem;">
                        <i class="fa-solid fa-chart-line"></i> Real-time Stats
                    </span>
                    <span
                        style="background: rgba(255,255,255,0.2); padding: 0.5rem 1rem; border-radius: 20px; font-size: 0.9rem;">
                        <i class="fa-solid fa-file-invoice-dollar"></i> Easy Billing
                    </span>
                </div>
            </div>
        </div>
        <div class="split-right">
            <div class="auth-card animate-slide-up">
                <div class="auth-header">
                    <div class="auth-logo">
                        <img src="../assets/logo.jpg" alt="Logo" style="height: 40px;">
                        Happy Living
                    </div>
                    <h2 style="margin-bottom: 0.5rem;">Admin Login</h2>
                    <p style="color: var(--text-muted);">Access dashboard to manage PGs</p>
                </div>

                <!-- Role Toggle Removed -->

                <form id="loginForm" onsubmit="handleLogin(event)">
                    <div class="form-group">
                        <label class="form-label">Username</label>
                        <div class="input-group">
                            <i class="fa-solid fa-user-shield input-icon"></i>
                            <input type="text" class="auth-input" id="username" placeholder="admin" required>
                        </div>
                    </div>

                    <div class="form-group">
                        <label class="form-label">Password</label>
                        <div class="input-group">
                            <i class="fa-solid fa-lock input-icon"></i>
                            <input type="password" class="auth-input" id="password" placeholder="••••••••" required>
                            <i class="fa-solid fa-eye password-toggle" onclick="togglePassword('password')"></i>
                        </div>
                    </div>

                    <div
                        style="display: flex; justify-content: space-between; margin-bottom: 1.5rem; font-size: 0.9rem;">
                        <label style="display: flex; align-items: center; gap: 0.5rem; cursor: pointer;">
                            <input type="checkbox" style="accent-color: var(--primary);"> Remember me
                        </label>
                        <!-- Admin usually doesn't have public forgot password flow, but UI symmetry is fine -->
                        <a href="../forgot-password.html" style="color: var(--cyber-cyan); font-weight: 600;">Forgot
                            Password?</a>
                    </div>

                    <button type="submit" class="btn btn-primary" style="width: 100%;">
                        Access Dashboard <i class="fa-solid fa-arrow-right"></i>
                    </button>
                </form>

                <div style="text-align: center; margin-top: 1.5rem; font-size: 0.9rem; color: var(--text-muted);">
                    Don't have an admin account? <a href="signup.html"
                        style="color: var(--cyber-cyan); font-weight: 600;">Create Account</a>
                </div>

                <div style="text-align: center; margin-top: 1.5rem;">
                    <a href="../index.html" style="font-size: 0.85rem; color: var(--text-muted);"><i
                            class="fa-solid fa-arrow-left"></i> Back to Home</a>
                </div>
            </div>
        </div>
    </div>

    <script src="../js/main.js"></script>
    <script src="../js/data.js"></script>
    <script src="../js/auth-service.js"></script>
    <script>
        function togglePassword(inputId) {
            const input = document.getElementById(inputId);
            const icon = event.currentTarget;
            if (input.type === "password") {
                input.type = "text";
                icon.classList.replace("fa-eye", "fa-eye-slash");
            } else {
                input.type = "password";
                icon.classList.replace("fa-eye-slash", "fa-eye");
            }
        }

        async function handleLogin(e) {
            e.preventDefault();
            const username = document.getElementById('username').value;
            const password = document.getElementById('password').value;
            const btn = e.target.querySelector('button[type="submit"]');

            // Loading state
            const originalText = btn.innerHTML;
            btn.innerHTML = '<i class="fa-solid fa-circle-notch fa-spin"></i> Verifying...';
            btn.disabled = true;

            try {
                // Simulate network delay
                await new Promise(resolve => setTimeout(resolve, 800));

                let success = false;

                if (window.AuthService) {
                    const email = username.includes('@') ? username : 'admin@happylivingpg.com';
                    const result = await AuthService.login(email, password, 'admin');
                    localStorage.setItem('user', JSON.stringify(result.user));
                    success = true;
                } else {
                    // Fallback logic if Service not loaded
                    if (username === 'admin' && password === 'admin123') {
                        success = true;
                        localStorage.setItem('user', JSON.stringify({ name: 'System Admin', role: 'admin', id: 'admin-001' }));
                    }
                }

                if (success) {
                    window.location.href = 'dashboard.html';
                } else {
                    throw new Error('Invalid credentials');
                }
            } catch (err) {
                alert('Login Failed: ' + err.message);
                btn.innerHTML = originalText;
                btn.disabled = false;
            }
        }
    </script>
</body>

</html>
