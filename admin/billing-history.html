<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Billing History | Happy Living Admin</title>
    <link rel="stylesheet" href="../css/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        .dashboard-container {
            display: flex;
            min-height: 100vh;
        }

        .sidebar {
            width: 260px;
            background: rgba(255, 255, 255, 0.9);
            backdrop-filter: blur(10px);
            border-right: 1px solid rgba(0, 0, 0, 0.05);
            padding: 2rem;
            position: fixed;
            height: 100vh;
            overflow-y: auto;
            z-index: 100;
        }

        .main-content {
            margin-left: 260px;
            flex: 1;
            padding: 2rem;
        }

        .nav-item {
            display: flex;
            align-items: center;
            gap: 1rem;
            padding: 1rem;
            color: var(--text-muted);
            border-radius: var(--radius-md);
            margin-bottom: 0.5rem;
            cursor: pointer;
        }

        .nav-item:hover,
        .nav-item.active {
            background: rgba(79, 70, 229, 0.05);
            color: var(--primary);
        }

        .billing-summary {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 1.5rem;
            margin-bottom: 2rem;
        }

        @media (max-width: 900px) {
            .dashboard-container {
                flex-direction: column;
            }

            .sidebar {
                width: 100%;
                height: auto;
                position: relative;
                padding: 1rem;
                border-bottom: 1px solid rgba(0, 0, 0, 0.05);
            }

            .main-content {
                margin-left: 0;
                padding: 1rem;
            }
        }
    </style>
</head>

<body>
    <div class="dashboard-container">
        <!-- Sidebar -->
        <aside class="sidebar">
            <div class="logo" style="margin-bottom: 2rem;">
                <img src="../assets/logo.jpg" alt="Logo" style="height: 30px;">
                Happy Living
            </div>
            <nav class="sidebar-nav">
                <div class="nav-item" onclick="window.location.href='dashboard.html'">
                    <i class="fa-solid fa-gauge"></i> Dashboard
                </div>
                <div class="nav-item" onclick="window.location.href='residents.html'">
                    <i class="fa-solid fa-users"></i> Residents
                </div>
                <div class="nav-item active">
                    <i class="fa-solid fa-file-invoice-dollar"></i> Billing History
                </div>
                <div class="nav-item" onclick="Auth.logout()">
                    <i class="fa-solid fa-right-from-bracket"></i> Logout
                </div>
            </nav>
        </aside>

        <!-- Main Content -->
        <main class="main-content">
            <header style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 2rem;">
                <div>
                    <h1 style="font-size: 1.8rem;">All Transactions</h1>
                    <p style="color: var(--text-muted);">Comprehensive list of all payments and dues</p>
                </div>
                <button class="btn btn-primary" onclick="window.print()">
                    <i class="fa-solid fa-print"></i> Export Report
                </button>
            </header>

            <div class="billing-summary">
                <div class="stat-card">
                    <div>
                        <h3 id="totalRevenue">₹0</h3>
                        <p style="color: var(--text-muted);">Total Revenue</p>
                    </div>
                </div>
                <div class="stat-card">
                    <div>
                        <h3 id="pendingDues" style="color: var(--secondary);">₹0</h3>
                        <p style="color: var(--text-muted);">Total Dues</p>
                    </div>
                </div>
            </div>

            <div class="filter-bar"
                style="background: white; padding: 1rem; border-radius: var(--radius-md); margin-bottom: 2rem; display: flex; gap: 1rem; box-shadow: var(--shadow-sm);">
                <input type="text" id="txnSearch" class="search-input" placeholder="Search by student or TXN ID..."
                    oninput="renderTransactions()">
                <select id="typeFilter" class="form-input" style="width: auto;" onchange="renderTransactions()">
                    <option value="all">All Types</option>
                    <option value="Rent">Rent</option>
                    <option value="Mess">Mess</option>
                </select>
            </div>

            <div class="table-container">
                <table>
                    <thead>
                        <tr>
                            <th>Transaction ID</th>
                            <th>Date</th>
                            <th>Student</th>
                            <th>Type</th>
                            <th>Amount</th>
                            <th>Method</th>
                            <th>Status</th>
                        </tr>
                    </thead>
                    <tbody id="txnTableBody">
                        <!-- Populated by JS -->
                    </tbody>
                </table>
            </div>
        </main>
    </div>

    <script src="../js/data.js"></script>
    <script src="../js/auth-service.js"></script>
    <script src="../js/main.js"></script>
    <script>
        Auth.checkAuth('admin');

        function renderTransactions() {
            const payments = JSON.parse(localStorage.getItem('payments') || '[]');
            const searchTerm = document.getElementById('txnSearch').value.toLowerCase();
            const typeFilter = document.getElementById('typeFilter').value;

            let filtered = payments.filter(p => {
                const matchesSearch = p.transactionId.toLowerCase().includes(searchTerm) ||
                    p.email.toLowerCase().includes(searchTerm);
                const matchesType = typeFilter === 'all' || p.type === typeFilter;
                return matchesSearch && matchesType;
            });

            // Sort by date desc
            filtered.sort((a, b) => b.id - a.id);

            const tbody = document.getElementById('txnTableBody');
            tbody.innerHTML = filtered.map(p => `
                <tr>
                    <td><code>${p.transactionId}</code></td>
                    <td>${new Date(p.timestamp || p.id).toLocaleDateString()}</td>
                    <td>${p.email}</td>
                    <td>${p.type}</td>
                    <td style="font-weight: 600;">₹${p.amount.toLocaleString()}</td>
                    <td>${p.method || 'Online'}</td>
                    <td><span class="status-badge status-paid">${p.status}</span></td>
                </tr>
            `).join('');

            // Totals
            const total = payments.filter(p => p.status === 'Completed').reduce((sum, p) => sum + p.amount, 0);
            document.getElementById('totalRevenue').textContent = '₹' + total.toLocaleString();
        }

        renderTransactions();
    </script>
</body>

</html>
