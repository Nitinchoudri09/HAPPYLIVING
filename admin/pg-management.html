<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PG Management | Happy Living Admin</title>
    <link rel="stylesheet" href="../css/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        .dashboard-container {
            display: flex;
            min-height: 100vh;
            position: relative;
            z-index: 1;
        }

        .sidebar {
            width: 260px;
            background: var(--bg-glass);
            backdrop-filter: blur(25px);
            border-right: 1px solid rgba(0, 0, 0, 0.05);
            padding: 2.5rem 2rem;
            position: fixed;
            height: 100vh;
            overflow-y: auto;
            z-index: 100;
        }

        .main-content {
            margin-left: 260px;
            flex: 1;
            padding: 3rem;
        }

        .logo {
            display: flex;
            align-items: center;
            gap: 0.75rem;
            font-weight: 800;
            font-size: 1.3rem;
            color: var(--text-main);
            margin-bottom: 3.5rem;
        }

        .nav-item {
            display: flex;
            align-items: center;
            gap: 1rem;
            padding: 1.1rem 1.25rem;
            color: var(--text-muted);
            border-radius: var(--radius-md);
            margin-bottom: 0.6rem;
            cursor: pointer;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .nav-item:hover {
            color: var(--primary);
            background: var(--bg-light);
        }

        .nav-item.active {
            background: var(--bg-light);
            color: var(--primary);
            border: 1px solid var(--primary-glow);
            box-shadow: 0 4px 15px var(--primary-glow);
        }

        .pg-card-admin {
            background: var(--bg-glass);
            backdrop-filter: blur(25px);
            border-radius: 20px;
            overflow: hidden;
            box-shadow: var(--shadow-soft);
            margin-bottom: 2.5rem;
            border: 1px solid rgba(0, 0, 0, 0.05);
            transition: all 0.4s ease;
        }

        .pg-card-admin:hover {
            transform: translateY(-8px);
            border-color: var(--primary);
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.08);
        }

        .pricing-box {
            background: var(--bg-light);
            padding: 0.8rem 1.2rem;
            border-radius: 12px;
            border: 1px solid rgba(0, 0, 0, 0.05);
            display: flex;
            align-items: center;
            gap: 0.75rem;
        }

        /* Global Visibility Enhancements - Premium Luminous */
        h1,
        h2,
        h3,
        h4,
        label,
        strong {
            color: white !important;
            text-shadow: 0 2px 4px rgba(0, 0, 0, 0.8), 0 0 20px rgba(0, 242, 254, 0.3) !important;
        }

        p {
            color: rgba(255, 255, 255, 0.95) !important;
            text-shadow: 0 1px 3px rgba(0, 0, 0, 0.6) !important;
        }

        h2 {
            font-size: 2.2rem;
            margin-bottom: 2rem;
            background: linear-gradient(90deg, #fff, var(--cyber-cyan), #fff);
            background-size: 200% auto;
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
            filter: drop-shadow(0 0 15px rgba(0, 242, 254, 0.5));
            animation: shine 3s linear infinite;
        }

        @keyframes shine {
            to {
                background-position: 200% center;
            }
        }

        label {
            color: var(--cyber-cyan) !important;
            font-weight: 600;
            text-transform: uppercase;
            font-size: 0.8rem;
            letter-spacing: 1px;
        }

        @media (max-width: 900px) {
            .sidebar {
                width: 100%;
                height: auto;
                position: relative;
            }

            .main-content {
                margin-left: 0;
            }
        }
    </style>
</head>

<body>
    <div class="mesh-bg"></div>
    <div class="dashboard-container">
        <!-- Sidebar -->
        <aside class="sidebar">
            <div class="logo">
                <img src="../assets/logo.jpg" alt="Logo" style="height: 35px; border-radius: 6px;">
                Happy Living
            </div>
            <nav class="sidebar-nav">
                <div class="nav-item" onclick="window.location.href='dashboard.html'">
                    <i class="fa-solid fa-gauge"></i> Dashboard
                </div>
                <div class="nav-item" onclick="window.location.href='residents.html'">
                    <i class="fa-solid fa-users"></i> Residents
                </div>
                <div class="nav-item active">
                    <i class="fa-solid fa-hotel"></i> PG Management
                </div>
                <div class="nav-item" onclick="Auth.logout()" style="margin-top: 2rem; color: var(--secondary);">
                    <i class="fa-solid fa-right-from-bracket"></i> Logout
                </div>
            </nav>
        </aside>

        <!-- Main Content -->
        <main class="main-content">
            <header style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 3.5rem;">
                <div>
                    <h1
                        style="font-size: 2.8rem; margin: 0; background: linear-gradient(90deg, var(--text-main), var(--primary)); -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: transparent;">
                        PG Portfolio</h1>
                    <p style="margin-top: 0.5rem; font-size: 1.1rem; color: var(--text-muted); opacity: 1;">Analyze and
                        modulate
                        your PG properties and infrastructure</p>
                </div>
                <button class="btn btn-primary"
                    style="padding: 1.1rem 2rem; font-weight: 800; border-radius: 14px; box-shadow: 0 0 30px rgba(0, 242, 254, 0.3);"
                    onclick="openAddPropertyModal()">
                    <i class="fa-solid fa-plus"></i> ADD NEW PG
                </button>
            </header>

            <div id="pgListAdmin">
                <!-- JS Populated -->
            </div>
        </main>
    </div>

    <!-- Add Property Modal -->
    <div id="add-property-modal"
        style="display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100vh; background: rgba(0,0,0,0.85); backdrop-filter: blur(10px); z-index: 1000; align-items: center; justify-content: center;">
        <div class="glass-card"
            style="background: var(--bg-deep); width: 90%; max-width: 650px; padding: 3rem; border-radius: 24px; position: relative; max-height: 85vh; overflow-y: auto; border: 1px solid var(--primary-glow); box-shadow: 0 20px 50px rgba(0, 0, 0, 0.1);">
            <button onclick="closeAddPropertyModal()"
                style="position: absolute; top: 1.5rem; right: 1.5rem; border: none; background: none; font-size: 1.5rem; cursor: pointer; color: var(--text-main);"><i
                    class="fa-solid fa-xmark"></i></button>
            <h2 style="margin-bottom: 2rem; color: var(--primary) !important;">Incorporate New PG Property</h2>

            <form id="addPropertyForm" onsubmit="submitNewProperty(event)">
                <div style="display: grid; gap: 1.5rem;">
                    <div>
                        <label class="form-label">PG Identity / Name</label>
                        <input type="text" id="pg-name" class="form-input" required placeholder="e.g. Cyber Living PG"
                            style="width: 100%;">
                    </div>
                    <div>
                        <label class="form-label">Geographic Location / Address</label>
                        <input type="text" id="pg-address" class="form-input" required placeholder="Street, Area, City"
                            style="width: 100%;">
                    </div>
                    <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 1.5rem;">
                        <div>
                            <label class="form-label">PG Classification</label>
                            <select id="pg-type" class="form-input" required style="width: 100%;">
                                <option value="Boys PG">Boys PG</option>
                                <option value="Girls PG">Girls PG</option>
                                <option value="Co-Living">Co-Living</option>
                            </select>
                        </div>
                        <div>
                            <label class="form-label">Trust Rating (1-5)</label>
                            <input type="number" id="pg-rating" class="form-input" step="0.1" min="1" max="5"
                                value="4.5" style="width: 100%;">
                        </div>
                    </div>

                    <div>
                        <label class="form-label">Occupancy Pricing (type=price, e.g. 1=12000)</label>
                        <input type="text" id="pg-sharing" class="form-input" required
                            placeholder="1=12000, 2=8500, 3=6500" style="width: 100%;">
                    </div>

                    <div>
                        <label class="form-label">Digital Amenities (Comma separated)</label>
                        <input type="text" id="pg-amenities" class="form-input" required
                            placeholder="WiFi, High-Speed Fiber, Mess, Climate Control" style="width: 100%;">
                    </div>

                    <div>
                        <label class="form-label">Proprietary Image URL</label>
                        <input type="text" id="pg-image" class="form-input" placeholder="../assets/pg-default.jpg"
                            style="width: 100%;">
                    </div>

                    <button type="submit" class="btn btn-primary"
                        style="margin-top: 1.5rem; padding: 1.1rem; font-weight: 800; font-size: 1rem; letter-spacing: 1px;">DEPLOY
                        PROPERTY</button>
                </div>
            </form>
        </div>
    </div>

    <script src="../js/data.js"></script>
    <script src="../js/auth-service.js"></script>
    <script src="../js/main.js"></script>
    <script>
        Auth.checkAuth('admin');

        function renderPGsAdmin() {
            const PGs = getData.PGs();
            const list = document.getElementById('pgListAdmin');

            list.innerHTML = PGs.map(pg => `
                <div class="pg-card-admin">
                    <div class="pg-image-header" style="background-image: url('${pg.image.startsWith('..') ? pg.image : '../' + pg.image}')">
                        <div style="position: absolute; top: 1.5rem; left: 1.5rem; background: var(--bg-glass); backdrop-filter: blur(10px); color: var(--text-main); padding: 0.6rem 1.2rem; border-radius: 12px; border: 1px solid rgba(0, 0, 0, 0.05); display: flex; align-items: center; gap: 0.5rem; font-weight: 700; box-shadow: var(--shadow-soft);">
                            <i class="fa-solid fa-star" style="color: #f59e0b;"></i> ${pg.rating}
                        </div>
                        <div style="position: absolute; top: 1.5rem; right: 1.5rem;">
                            <span style="background: var(--primary); color: white; padding: 0.5rem 1rem; border-radius: 10px; font-weight: 800; font-size: 0.75rem; text-transform: uppercase;">${pg.type}</span>
                        </div>
                    </div>
                    <div class="pg-details-body">
                        <div style="display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 2rem;">
                            <div>
                                <h2 style="margin: 0; font-size: 1.8rem; letter-spacing: 0.5px; color: var(--text-main) !important; background: none; -webkit-text-fill-color: initial;">${pg.name}</h2>
                                <p style="color: var(--text-muted); margin-top: 0.5rem;"><i class="fa-solid fa-location-dot" style="color: var(--primary);"></i> ${pg.address}</p>
                            </div>
                        </div>

                        <div style="margin-bottom: 2.5rem;">
                            <h4 style="margin-bottom: 1rem; text-transform: uppercase; font-size: 0.85rem; letter-spacing: 1.5px; color: var(--primary) !important;">Infrastructure & Pricing</h4>
                            <div style="display: flex; gap: 1.25rem; flex-wrap: wrap;">
                                ${Object.entries(pg.sharingVariants).map(([sharing, price]) => `
                                    <div class="pricing-box">
                                        <span style="background: var(--primary); color: white; padding: 0.25rem 0.6rem; border-radius: 6px; font-size: 0.8rem; font-weight: 700;">${sharing} SHARING</span>
                                        <strong style="color: var(--text-main); font-size: 1.1rem;">₹${price.toLocaleString()}</strong>
                                    </div>
                                `).join('')}
                            </div>
                        </div>

                        <div style="margin-bottom: 2.5rem;">
                            <h4 style="margin-bottom: 1rem; text-transform: uppercase; font-size: 0.85rem; letter-spacing: 1.5px; color: var(--primary) !important;">Integrated Amenities</h4>
                            <div style="display: flex; flex-wrap: wrap; gap: 0.5rem;">
                                ${pg.amenities.map(a => `<span style="background: var(--bg-light); padding: 0.4rem 1rem; border-radius: 50px; font-size: 0.85rem; color: var(--primary); display: inline-flex; align-items: center; gap: 0.5rem; border: 1px solid var(--primary-glow); font-weight: 500;"><i class="fa-solid fa-bolt"></i> ${a}</span>`).join('')}
                            </div>
                        </div>

                        <div style="display: flex; gap: 1.25rem; border-top: 1px solid rgba(0,0,0,0.05); padding-top: 2rem;">
                            <button class="btn" style="background: var(--bg-light); color: var(--primary); flex: 1; padding: 0.9rem; font-weight: 700; border-radius: 12px; border: 1px solid var(--primary-glow);" onclick="alert('Editing ${pg.name}')">
                                <i class="fa-solid fa-pen-to-square"></i> EDIT CORE
                            </button>
                            <button class="btn" style="background: var(--bg-light); color: var(--primary); flex: 1; padding: 0.9rem; font-weight: 700; border-radius: 12px; border: 1px solid var(--primary-glow);" onclick="alert('Managing Gallery for ${pg.name}')">
                                <i class="fa-solid fa-images"></i> GALLERY
                            </button>
                            <button class="btn" style="background: rgba(244, 63, 94, 0.1); color: #f43f5e; border: 1px solid rgba(244, 63, 94, 0.2); padding: 0.9rem 1.5rem; font-weight: 700; border-radius: 12px;" onclick="alert('Delete restricted')">
                                <i class="fa-solid fa-trash"></i>
                            </button>
                        </div>
                    </div>
                </div>
            `).join('');
        }

        function openAddPropertyModal() {
            document.getElementById('add-property-modal').style.display = 'flex';
        }

        function closeAddPropertyModal() {
            document.getElementById('add-property-modal').style.display = 'none';
        }

        function submitNewProperty(event) {
            event.preventDefault();

            const name = document.getElementById('pg-name').value;
            const address = document.getElementById('pg-address').value;
            const type = document.getElementById('pg-type').value;
            const rating = document.getElementById('pg-rating').value;
            const sharingStr = document.getElementById('pg-sharing').value;
            const amenitiesStr = document.getElementById('pg-amenities').value;
            const image = document.getElementById('pg-image').value || '../assets/pg-default.jpg';

            // Parse sharing
            const sharingVariants = {};
            sharingStr.split(',').forEach(item => {
                const [key, val] = item.trim().split('=');
                if (key && val) sharingVariants[key.trim()] = parseInt(val.trim());
            });

            // Parse amenities
            const amenities = amenitiesStr.split(',').map(a => a.trim()).filter(a => a);

            const newPG = {
                id: Date.now(),
                name,
                address,
                type,
                rating,
                sharingVariants,
                amenities,
                image
            };

            const PGs = getData.PGs();
            PGs.push(newPG);
            DB.set('happyLiving_PGs', PGs);

            alert('Property added successfully!');
            closeAddPropertyModal();
            renderPGsAdmin();
        }

        renderPGsAdmin();
    </script>
</body>

</html>
