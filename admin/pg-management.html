<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PG Management | Happy Living Admin</title>
    <link rel="stylesheet" href="../css/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        .dashboard-container {
            display: flex;
            min-height: 100vh;
        }

        .sidebar {
            width: 260px;
            background: rgba(255, 255, 255, 0.9);
            backdrop-filter: blur(10px);
            border-right: 1px solid rgba(0, 0, 0, 0.05);
            padding: 2rem;
            position: fixed;
            height: 100vh;
            overflow-y: auto;
            z-index: 100;
        }

        .main-content {
            margin-left: 260px;
            flex: 1;
            padding: 2rem;
        }

        .nav-item {
            display: flex;
            align-items: center;
            gap: 1rem;
            padding: 1rem;
            color: var(--text-muted);
            border-radius: var(--radius-md);
            margin-bottom: 0.5rem;
            cursor: pointer;
        }

        .nav-item:hover,
        .nav-item.active {
            background: rgba(79, 70, 229, 0.05);
            color: var(--primary);
        }

        .pg-card-admin {
            background: white;
            border-radius: var(--radius-lg);
            overflow: hidden;
            box-shadow: var(--shadow-sm);
            margin-bottom: 2rem;
            border: 1px solid rgba(0, 0, 0, 0.05);
        }

        .pg-image-header {
            height: 200px;
            background-size: cover;
            background-position: center;
            position: relative;
        }

        .pg-details-body {
            padding: 2rem;
        }

        .amenity-tag {
            background: #f1f5f9;
            padding: 0.25rem 0.75rem;
            border-radius: 9999px;
            font-size: 0.85rem;
            color: var(--text-muted);
            display: inline-block;
            margin: 0.25rem;
        }

        .sharing-badge {
            background: var(--primary);
            color: white;
            padding: 0.2rem 0.5rem;
            border-radius: 4px;
            font-size: 0.8rem;
            font-weight: 600;
        }

        @media (max-width: 900px) {
            .dashboard-container {
                flex-direction: column;
            }

            .sidebar {
                width: 100%;
                height: auto;
                position: relative;
                padding: 1rem;
                border-bottom: 1px solid rgba(0, 0, 0, 0.05);
            }

            .main-content {
                margin-left: 0;
                padding: 1rem;
            }
        }
    </style>
</head>

<body>
    <div class="dashboard-container">
        <!-- Sidebar -->
        <aside class="sidebar">
            <div class="logo" style="margin-bottom: 2rem;">
                <img src="../assets/logo.jpg" alt="Logo" style="height: 30px;">
                Happy Living
            </div>
            <nav class="sidebar-nav">
                <div class="nav-item" onclick="window.location.href='dashboard.html'">
                    <i class="fa-solid fa-gauge"></i> Dashboard
                </div>
                <div class="nav-item" onclick="window.location.href='residents.html'">
                    <i class="fa-solid fa-users"></i> Residents
                </div>
                <div class="nav-item active">
                    <i class="fa-solid fa-hotel"></i> PG Management
                </div>
                <div class="nav-item" onclick="Auth.logout()">
                    <i class="fa-solid fa-right-from-bracket"></i> Logout
                </div>
            </nav>
        </aside>

        <!-- Main Content -->
        <main class="main-content">
            <header style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 2rem;">
                <div>
                    <h1 style="font-size: 1.8rem;">PG Properties Management</h1>
                    <p style="color: var(--text-muted);">View and manage all PG properties and their amenities</p>
                </div>
                <button class="btn btn-primary" onclick="openAddPropertyModal()">
                    <i class="fa-solid fa-plus"></i> Add New PG
                </button>
            </header>

            <div id="pgListAdmin">
                <!-- JS Populated -->
            </div>
        </main>
    </div>

    <!-- Add Property Modal -->
    <div id="add-property-modal"
        style="display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100vh; background: rgba(0,0,0,0.5); z-index: 1000; align-items: center; justify-content: center;">
        <div
            style="background: white; width: 90%; max-width: 600px; padding: 2rem; border-radius: var(--radius-lg); position: relative; max-height: 90vh; overflow-y: auto;">
            <button onclick="closeAddPropertyModal()"
                style="position: absolute; top: 1rem; right: 1rem; border: none; background: none; font-size: 1.2rem; cursor: pointer;"><i
                    class="fa-solid fa-xmark"></i></button>
            <h2 style="margin-bottom: 1.5rem;">Add New PG Property</h2>

            <form id="addPropertyForm" onsubmit="submitNewProperty(event)">
                <div style="display: grid; gap: 1rem;">
                    <div>
                        <label class="form-label">PG Name</label>
                        <input type="text" id="pg-name" class="form-input" required placeholder="e.g. Dream Stay PG">
                    </div>
                    <div>
                        <label class="form-label">Full Address</label>
                        <input type="text" id="pg-address" class="form-input" required placeholder="Street, Area, City">
                    </div>
                    <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 1rem;">
                        <div>
                            <label class="form-label">PG Type</label>
                            <select id="pg-type" class="form-input" required>
                                <option value="Boys PG">Boys PG</option>
                                <option value="Girls PG">Girls PG</option>
                                <option value="Co-Living">Co-Living</option>
                            </select>
                        </div>
                        <div>
                            <label class="form-label">Rating (1-5)</label>
                            <input type="number" id="pg-rating" class="form-input" step="0.1" min="1" max="5"
                                value="4.5">
                        </div>
                    </div>

                    <div>
                        <label class="form-label">Sharing Variants (Format: type=price, e.g. 1=12000, 2=8500)</label>
                        <input type="text" id="pg-sharing" class="form-input" required
                            placeholder="1=12000, 2=8500, 3=6500">
                    </div>

                    <div>
                        <label class="form-label">Amenities (Comma separated)</label>
                        <input type="text" id="pg-amenities" class="form-input" required
                            placeholder="WiFi, Laundry, Mess, AC">
                    </div>

                    <div>
                        <label class="form-label">Image URL (or leave default)</label>
                        <input type="text" id="pg-image" class="form-input" placeholder="../assets/pg-default.jpg">
                    </div>

                    <button type="submit" class="btn btn-primary" style="margin-top: 1rem;">Save Property</button>
                </div>
            </form>
        </div>
    </div>

    <script src="../js/data.js"></script>
    <script src="../js/auth-service.js"></script>
    <script src="../js/main.js"></script>
    <script>
        Auth.checkAuth('admin');

        function renderPGsAdmin() {
            const PGs = getData.PGs();
            const list = document.getElementById('pgListAdmin');

            list.innerHTML = PGs.map(pg => `
                <div class="pg-card-admin">
                    <div class="pg-image-header" style="background-image: url('${pg.image.startsWith('..') ? pg.image : '../' + pg.image}')">
                        <div style="position: absolute; bottom: 1rem; left: 1rem; background: rgba(0,0,0,0.6); color: white; padding: 0.5rem 1rem; border-radius: 4px;">
                            <i class="fa-solid fa-star" style="color: #f59e0b;"></i> ${pg.rating}
                        </div>
                    </div>
                    <div class="pg-details-body">
                        <div style="display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 1rem;">
                            <div>
                                <h2 style="margin: 0; font-size: 1.5rem;">${pg.name}</h2>
                                <p style="color: var(--text-muted);"><i class="fa-solid fa-location-dot"></i> ${pg.address}</p>
                            </div>
                            <div style="text-align: right;">
                                <span class="status-badge" style="background: var(--primary)20; color: var(--primary);">${pg.type}</span>
                            </div>
                        </div>

                        <div style="margin-bottom: 1.5rem;">
                            <h4 style="margin-bottom: 0.5rem;">Pricing & Sharing</h4>
                            <div style="display: flex; gap: 1rem; flex-wrap: wrap;">
                                ${Object.entries(pg.sharingVariants).map(([sharing, price]) => `
                                    <div style="background: var(--bg-light); padding: 0.5rem 1rem; border-radius: 8px; border: 1px solid #e2e8f0;">
                                        <span class="sharing-badge">${sharing} Sharing</span>
                                        <strong style="margin-left: 0.5rem;">₹${price.toLocaleString()}</strong>
                                    </div>
                                `).join('')}
                            </div>
                        </div>

                        <div style="margin-bottom: 1.5rem;">
                            <h4 style="margin-bottom: 0.5rem;">Amenities</h4>
                            <div>
                                ${pg.amenities.map(a => `<span class="amenity-tag"><i class="fa-solid fa-check"></i> ${a}</span>`).join('')}
                            </div>
                        </div>

                        <div style="display: flex; gap: 1rem; border-top: 1px solid #f1f5f9; padding-top: 1.5rem;">
                            <button class="btn btn-secondary" onclick="alert('Editing ${pg.name}')">
                                <i class="fa-solid fa-pen-to-square"></i> Edit Details
                            </button>
                            <button class="btn btn-secondary" onclick="alert('Managing Gallery for ${pg.name}')">
                                <i class="fa-solid fa-images"></i> Manage Photos
                            </button>
                            <button class="btn" style="background: #fee2e2; color: #991b1b;" onclick="alert('Delete property restricted')">
                                <i class="fa-solid fa-trash"></i> Delete
                            </button>
                        </div>
                    </div>
                </div>
            `).join('');
        }

        function openAddPropertyModal() {
            document.getElementById('add-property-modal').style.display = 'flex';
        }

        function closeAddPropertyModal() {
            document.getElementById('add-property-modal').style.display = 'none';
        }

        function submitNewProperty(event) {
            event.preventDefault();

            const name = document.getElementById('pg-name').value;
            const address = document.getElementById('pg-address').value;
            const type = document.getElementById('pg-type').value;
            const rating = document.getElementById('pg-rating').value;
            const sharingStr = document.getElementById('pg-sharing').value;
            const amenitiesStr = document.getElementById('pg-amenities').value;
            const image = document.getElementById('pg-image').value || '../assets/pg-default.jpg';

            // Parse sharing
            const sharingVariants = {};
            sharingStr.split(',').forEach(item => {
                const [key, val] = item.trim().split('=');
                if (key && val) sharingVariants[key.trim()] = parseInt(val.trim());
            });

            // Parse amenities
            const amenities = amenitiesStr.split(',').map(a => a.trim()).filter(a => a);

            const newPG = {
                id: Date.now(),
                name,
                address,
                type,
                rating,
                sharingVariants,
                amenities,
                image
            };

            const PGs = getData.PGs();
            PGs.push(newPG);
            DB.set('happyLiving_PGs', PGs);

            alert('Property added successfully!');
            closeAddPropertyModal();
            renderPGsAdmin();
        }

        renderPGsAdmin();
    </script>
</body>

</html>
