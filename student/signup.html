<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign Up | Happy Living</title>
    <link rel="stylesheet" href="../css/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>

<body>
    <div class="split-screen">
        <div class="split-left bg-mess-meal animate-fade-in">
            <div class="split-content">
                <h1 style="font-size: 3rem; margin-bottom: 1rem;">Join Our Community</h1>
                <p style="font-size: 1.2rem; opacity: 0.9;">Experience Premium Student Living with Delicious Meals</p>
                <div style="margin-top: 2rem; display: flex; gap: 1rem; justify-content: center;">
                    <span
                        style="background: rgba(255,255,255,0.2); padding: 0.5rem 1rem; border-radius: 20px; font-size: 0.9rem;">
                        <i class="fa-solid fa-users"></i> Vibrant Community
                    </span>
                    <span
                        style="background: rgba(255,255,255,0.2); padding: 0.5rem 1rem; border-radius: 20px; font-size: 0.9rem;">
                        <i class="fa-solid fa-wifi"></i> Free WiFi
                    </span>
                </div>
            </div>
        </div>
        <div class="split-right">
            <div class="auth-card animate-slide-up">
                <div class="auth-header">
                    <div class="auth-logo">
                        <img src="../assets/logo.jpg" alt="Logo" style="height: 40px;">
                        Happy Living
                    </div>
                    <h2>Create Account</h2>
                    <p style="color: var(--text-muted);">Join as a Student</p>
                </div>

                <form id="signupForm" onsubmit="handleSignup(event)">
                    <div class="form-group">
                        <label class="form-label">Full Name</label>
                        <div class="input-group">

                            <i class="fa-solid fa-user input-icon"></i>
                            <input type="text" class="auth-input" id="name" placeholder="nitin" required>
                        </div>
                    </div>

                    <div class="form-group">
                        <label class="form-label">Email Address</label>
                        <div class="input-group">
                            <i class="fa-solid fa-envelope input-icon"></i>
                            <input type="email" class="auth-input" id="email" placeholder="john@example.com" required>
                        </div>
                    </div>

                    <div class="form-group">
                        <label class="form-label">Phone Number</label>
                        <div class="input-group">
                            <i class="fa-solid fa-phone input-icon"></i>
                            <input type="tel" class="auth-input" id="phone" placeholder="9876543210" required>
                        </div>
                    </div>

                    <div class="form-group">
                        <label class="form-label">Password</label>
                        <div class="input-group">
                            <i class="fa-solid fa-lock input-icon"></i>
                            <input type="password" class="auth-input" id="password" placeholder="Create a password"
                                required oninput="checkStrength(this.value)">
                            <i class="fa-solid fa-eye password-toggle" onclick="togglePassword('password')"></i>
                        </div>
                        <div id="strength-bar"
                            style="height: 4px; background: #e2e8f0; margin-top: 0.5rem; border-radius: 2px; overflow: hidden;">
                            <div id="strength-fill" style="height: 100%; width: 0%; transition: all 0.3s;"></div>
                        </div>
                        <div id="strength-text"
                            style="font-size: 0.75rem; color: var(--text-muted); margin-top: 0.25rem; text-align: right;">
                        </div>
                    </div>

                    <div class="form-group">
                        <label class="form-label">Confirm Password</label>
                        <div class="input-group">
                            <i class="fa-solid fa-lock input-icon"></i>
                            <input type="password" class="auth-input" id="confirm-password"
                                placeholder="Confirm password" required>
                        </div>
                    </div>

                    <button type="submit" class="btn btn-primary"
                        style="width: 100%; background: linear-gradient(135deg, var(--secondary) 0%, #e11d48 100%);">
                        Create Account <i class="fa-solid fa-arrow-right"></i>
                    </button>
                </form>

                <div style="text-align: center; margin-top: 1.5rem; font-size: 0.9rem; color: var(--text-muted);">
                    Already have an account? <a href="login.html" style="color: var(--secondary); font-weight: 600;">Log
                        In</a>
                </div>
            </div>
        </div>
    </div>

    <!-- Success Modal -->
    <div id="success-modal"
        style="display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); z-index: 2000; align-items: center; justify-content: center;">
        <div class="glass-card animate-pop-in"
            style="background: white !important; padding: 2rem; width: 90%; max-width: 400px; text-align: center;">
            <div
                style="width: 60px; height: 60px; background: #dcfce7; border-radius: 50%; display: flex; align-items: center; justify-content: center; margin: 0 auto 1.5rem auto; color: #166534; font-size: 1.5rem;">
                <i class="fa-solid fa-check"></i>
            </div>
            <h3>Account Created!</h3>
            <p style="color: var(--text-muted); margin: 1rem 0;">Your account has been created successfully. Redirecting
                to login...</p>
        </div>
    </div>

    <script src="../js/auth-service.js"></script>
    <script>
        function togglePassword(inputId) {
            const input = document.getElementById(inputId);
            const icon = event.currentTarget;
            if (input.type === "password") {
                input.type = "text";
                icon.classList.replace("fa-eye", "fa-eye-slash");
            } else {
                input.type = "password";
                icon.classList.replace("fa-eye-slash", "fa-eye");
            }
        }

        function checkStrength(password) {
            const fill = document.getElementById('strength-fill');
            const text = document.getElementById('strength-text');
            let strength = 0;
            if (password.length > 5) strength += 25;
            if (password.match(/[A-Z]/)) strength += 25;
            if (password.match(/[0-9]/)) strength += 25;
            if (password.match(/[^A-Za-z0-9]/)) strength += 25;

            fill.style.width = strength + '%';
            if (strength <= 25) {
                fill.style.background = '#ef4444';
                text.textContent = 'Weak';
            } else if (strength <= 50) {
                fill.style.background = '#f59e0b';
                text.textContent = 'Fair';
            } else if (strength <= 75) {
                fill.style.background = '#3b82f6';
                text.textContent = 'Good';
            } else {
                fill.style.background = '#10b981';
                text.textContent = 'Strong';
            }
        }

        async function handleSignup(e) {
            e.preventDefault();
            const name = document.getElementById('name').value;
            const email = document.getElementById('email').value;
            const phone = document.getElementById('phone').value;
            const password = document.getElementById('password').value;
            const confirm = document.getElementById('confirm-password').value;
            const btn = e.target.querySelector('button[type="submit"]');

            if (password !== confirm) {
                alert('Passwords do not match!');
                return;
            }

            // Loading state
            const originalText = btn.innerHTML;
            btn.innerHTML = '<i class="fa-solid fa-circle-notch fa-spin"></i> Creating Account...';
            btn.disabled = true;

            try {
                // Simulate network delay
                await new Promise(resolve => setTimeout(resolve, 1000));

                if (window.AuthService) {
                    await AuthService.register({ name, email, phone, password }, 'student');
                    document.getElementById('success-modal').style.display = 'flex';
                    setTimeout(() => {
                        window.location.href = 'login.html';
                    }, 2000);
                } else {
                    throw new Error('Auth service not found');
                }
            } catch (err) {
                alert('Registration Failed: ' + err.message);
                btn.innerHTML = originalText;
                btn.disabled = false;
            }
        }
    </script>
</body>

</html>
