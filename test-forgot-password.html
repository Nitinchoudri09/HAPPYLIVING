<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Test Forgot Password - Happy Living</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            margin: 0;
            padding: 2rem;
            min-height: 100vh;
        }
        
        .test-container {
            background: white;
            border-radius: 16px;
            padding: 2rem;
            box-shadow: 0 20px 40px rgba(0,0,0,0.1);
            max-width: 600px;
            width: 100%;
            margin: 0 auto;
        }
        
        .test-container h1 {
            color: #333;
            margin-bottom: 1rem;
            text-align: center;
        }
        
        .test-section {
            background: #f8fafc;
            border: 1px solid #e2e8f0;
            border-radius: 8px;
            padding: 1.5rem;
            margin: 1rem 0;
        }
        
        .test-section h3 {
            color: #1e293b;
            margin: 0 0 1rem 0;
            font-size: 1.1rem;
        }
        
        .test-button {
            background: #4f46e5;
            color: white;
            border: none;
            padding: 0.75rem 1.5rem;
            border-radius: 6px;
            font-size: 0.9rem;
            font-weight: 600;
            cursor: pointer;
            margin: 0.5rem;
            transition: background 0.2s;
        }
        
        .test-button:hover {
            background: #4338ca;
        }
        
        .test-button:disabled {
            background: #94a3b8;
            cursor: not-allowed;
        }
        
        .result-box {
            background: #f0f9ff;
            border: 1px solid #0ea5e9;
            border-radius: 6px;
            padding: 1rem;
            margin: 1rem 0;
            font-family: monospace;
            font-size: 0.85rem;
            white-space: pre-wrap;
            max-height: 200px;
            overflow-y: auto;
        }
        
        .success {
            background: #f0fdf4;
            border-color: #10b981;
            color: #166534;
        }
        
        .error {
            background: #fef2f2;
            border-color: #ef4444;
            color: #991b1b;
        }
        
        .form-group {
            margin: 1rem 0;
        }
        
        .form-group label {
            display: block;
            margin-bottom: 0.5rem;
            font-weight: 600;
            color: #374151;
        }
        
        .form-group input {
            width: 100%;
            padding: 0.75rem;
            border: 1px solid #d1d5db;
            border-radius: 6px;
            font-size: 0.9rem;
        }
        
        .form-group input:focus {
            outline: none;
            border-color: #4f46e5;
            box-shadow: 0 0 0 3px rgba(79, 70, 229, 0.1);
        }
        
        .otp-display {
            background: #fef3c7;
            border: 1px solid #f59e0b;
            border-radius: 6px;
            padding: 1rem;
            margin: 1rem 0;
            text-align: center;
            font-size: 1.2rem;
            font-weight: bold;
            color: #92400e;
        }
    </style>
</head>
<body>
    <div class="test-container">
        <h1><i class="fa-solid fa-key"></i> Forgot Password Test</h1>
        <p style="text-align: center; color: #666; margin-bottom: 2rem;">Test the forgot password functionality step by step</p>
        
        <!-- Step 1: Test User Existence -->
        <div class="test-section">
            <h3><i class="fa-solid fa-search"></i> Step 1: Check User Existence</h3>
            <div class="form-group">
                <label for="test-email">Email Address:</label>
                <input type="email" id="test-email" placeholder="Enter email to test" value="student@example.com">
            </div>
            <button class="test-button" onclick="testUserExists()">Check if User Exists</button>
            <div id="user-result" class="result-box" style="display: none;"></div>
        </div>
        
        <!-- Step 2: Test OTP Generation -->
        <div class="test-section">
            <h3><i class="fa-solid fa-envelope"></i> Step 2: Generate OTP</h3>
            <button class="test-button" onclick="testGenerateOTP()">Generate OTP for Test Email</button>
            <div id="otp-result" class="result-box" style="display: none;"></div>
            <div id="otp-display" class="otp-display" style="display: none;"></div>
        </div>
        
        <!-- Step 3: Test OTP Verification -->
        <div class="test-section">
            <h3><i class="fa-solid fa-check"></i> Step 3: Verify OTP</h3>
            <div class="form-group">
                <label for="test-otp">Enter OTP:</label>
                <input type="text" id="test-otp" placeholder="Enter 6-digit OTP" maxlength="6">
            </div>
            <button class="test-button" onclick="testVerifyOTP()">Verify OTP</button>
            <div id="verify-result" class="result-box" style="display: none;"></div>
        </div>
        
        <!-- Step 4: Test Password Reset -->
        <div class="test-section">
            <h3><i class="fa-solid fa-lock"></i> Step 4: Reset Password</h3>
            <div class="form-group">
                <label for="new-password">New Password:</label>
                <input type="password" id="new-password" placeholder="Enter new password">
            </div>
            <button class="test-button" onclick="testResetPassword()">Reset Password</button>
            <div id="reset-result" class="result-box" style="display: none;"></div>
        </div>
        
        <!-- Step 5: Test Login with New Password -->
        <div class="test-section">
            <h3><i class="fa-solid fa-sign-in-alt"></i> Step 5: Test Login</h3>
            <button class="test-button" onclick="testLogin()">Test Login with New Password</button>
            <div id="login-result" class="result-box" style="display: none;"></div>
        </div>
        
        <!-- Full Flow Test -->
        <div class="test-section">
            <h3><i class="fa-solid fa-play"></i> Complete Flow Test</h3>
            <button class="test-button" onclick="testCompleteFlow()">Run Complete Forgot Password Flow</button>
            <div id="complete-result" class="result-box" style="display: none;"></div>
        </div>
    </div>

    <script src="js/auth-service.js"></script>
    <script>
        let testEmail = '';
        let generatedOTP = '';
        
        function showResult(elementId, message, type = 'info') {
            const element = document.getElementById(elementId);
            element.style.display = 'block';
            element.className = `result-box ${type}`;
            element.textContent = message;
        }
        
        function showOTPDisplay(otp) {
            const display = document.getElementById('otp-display');
            display.style.display = 'block';
            display.innerHTML = `<i class="fa-solid fa-lock"></i> Generated OTP: <strong>${otp}</strong>`;
        }
        
        async function testUserExists() {
            const email = document.getElementById('test-email').value.trim();
            if (!email) {
                showResult('user-result', 'Please enter an email address', 'error');
                return;
            }
            
            testEmail = email;
            showResult('user-result', 'Checking user existence...', 'info');
            
            try {
                // Check different user stores
                let userExists = false;
                let userType = '';
                
                // Check registered students
                const students = JSON.parse(localStorage.getItem('registered_students') || '[]');
                if (students.find(s => s.email && s.email.toLowerCase() === email.toLowerCase())) {
                    userExists = true;
                    userType = 'Registered Student';
                }
                
                // Check registered admins
                if (!userExists) {
                    const admins = JSON.parse(localStorage.getItem('registered_admins') || '[]');
                    if (admins.find(a => a.email && a.email.toLowerCase() === email.toLowerCase())) {
                        userExists = true;
                        userType = 'Registered Admin';
                    }
                }
                
                // Check hardcoded admin
                if (!userExists && email.toLowerCase() === 'admin@happylivingpg.com') {
                    userExists = true;
                    userType = 'Hardcoded Admin';
                }
                
                // Check bookings
                if (!userExists) {
                    const bookings = JSON.parse(localStorage.getItem('bookings') || '[]');
                    if (bookings.find(b => b.email && b.email.toLowerCase() === email.toLowerCase())) {
                        userExists = true;
                        userType = 'Booking User';
                    }
                }
                
                // Check demo accounts
                if (!userExists && (email.toLowerCase() === 'student@example.com')) {
                    userExists = true;
                    userType = 'Demo Student';
                }
                
                if (userExists) {
                    showResult('user-result', `✅ User found!\nEmail: ${email}\nType: ${userType}\n\nThis user can reset password.`, 'success');
                } else {
                    showResult('user-result', `❌ No user found with email: ${email}\n\nTry:\n- student@example.com (demo)\n- admin@happylivingpg.com\n- Or create a new account first`, 'error');
                }
                
            } catch (error) {
                showResult('user-result', `Error checking user: ${error.message}`, 'error');
            }
        }
        
        async function testGenerateOTP() {
            if (!testEmail) {
                showResult('otp-result', 'Please check user existence first', 'error');
                return;
            }
            
            showResult('otp-result', 'Generating OTP...', 'info');
            
            try {
                const result = await AuthService.forgotPassword(testEmail);
                
                // Get the generated OTP from storage
                const otpStorage = JSON.parse(localStorage.getItem('otp_storage') || '[]');
                const otpRecord = otpStorage.find(o => o.email === testEmail);
                generatedOTP = otpRecord ? otpRecord.otp : 'Not found';
                
                showResult('otp-result', `✅ OTP generated successfully!\n\nResult: ${JSON.stringify(result, null, 2)}`, 'success');
                showOTPDisplay(generatedOTP);
                
                console.log('Generated OTP:', generatedOTP);
                
            } catch (error) {
                showResult('otp-result', `Error generating OTP: ${error.message}`, 'error');
            }
        }
        
        async function testVerifyOTP() {
            const otp = document.getElementById('test-otp').value.trim();
            
            if (!otp) {
                showResult('verify-result', 'Please enter an OTP', 'error');
                return;
            }
            
            if (!testEmail) {
                showResult('verify-result', 'Please generate OTP first', 'error');
                return;
            }
            
            showResult('verify-result', 'Verifying OTP...', 'info');
            
            try {
                const verification = AuthService.verifyOTP(testEmail, otp);
                
                if (verification.valid) {
                    showResult('verify-result', `✅ OTP verified successfully!\n\nMessage: ${verification.message}`, 'success');
                } else {
                    showResult('verify-result', `❌ OTP verification failed!\n\nMessage: ${verification.message}`, 'error');
                }
                
            } catch (error) {
                showResult('verify-result', `Error verifying OTP: ${error.message}`, 'error');
            }
        }
        
        async function testResetPassword() {
            const newPassword = document.getElementById('new-password').value;
            const otp = document.getElementById('test-otp').value.trim();
            
            if (!newPassword) {
                showResult('reset-result', 'Please enter a new password', 'error');
                return;
            }
            
            if (!otp) {
                showResult('reset-result', 'Please verify OTP first', 'error');
                return;
            }
            
            if (!testEmail) {
                showResult('reset-result', 'Please generate OTP first', 'error');
                return;
            }
            
            showResult('reset-result', 'Resetting password...', 'info');
            
            try {
                const result = await AuthService.resetPassword(testEmail, otp, newPassword);
                
                showResult('reset-result', `✅ Password reset successfully!\n\nResult: ${JSON.stringify(result, null, 2)}`, 'success');
                
                // Clear OTP after successful reset
                document.getElementById('test-otp').value = '';
                
            } catch (error) {
                showResult('reset-result', `Error resetting password: ${error.message}`, 'error');
            }
        }
        
        async function testLogin() {
            const newPassword = document.getElementById('new-password').value;
            
            if (!newPassword || !testEmail) {
                showResult('login-result', 'Please reset password first', 'error');
                return;
            }
            
            showResult('login-result', 'Testing login with new password...', 'info');
            
            try {
                const result = await AuthService.login(testEmail, newPassword, 'student');
                
                showResult('login-result', `✅ Login successful!\n\nUser: ${JSON.stringify(result.user, null, 2)}\n\nToken received: ${result.accessToken ? 'Yes' : 'No'}`, 'success');
                
            } catch (error) {
                showResult('login-result', `❌ Login failed: ${error.message}`, 'error');
            }
        }
        
        async function testCompleteFlow() {
            const email = document.getElementById('test-email').value.trim() || 'student@example.com';
            const newPassword = 'newpassword123';
            
            showResult('complete-result', 'Starting complete forgot password flow...', 'info');
            
            try {
                // Step 1: Generate OTP
                showResult('complete-result', 'Step 1: Generating OTP...', 'info');
                const otpResult = await AuthService.forgotPassword(email);
                
                // Get OTP
                const otpStorage = JSON.parse(localStorage.getItem('otp_storage') || '[]');
                const otpRecord = otpStorage.find(o => o.email === email);
                const otp = otpRecord ? otpRecord.otp : '123456';
                
                showResult('complete-result', `Step 1: ✅ OTP generated: ${otp}`, 'success');
                
                // Wait a moment
                await new Promise(resolve => setTimeout(resolve, 1000));
                
                // Step 2: Reset password
                showResult('complete-result', 'Step 2: Resetting password...', 'info');
                const resetResult = await AuthService.resetPassword(email, otp, newPassword);
                
                showResult('complete-result', `Step 2: ✅ Password reset complete!`, 'success');
                
                // Wait a moment
                await new Promise(resolve => setTimeout(resolve, 1000));
                
                // Step 3: Test login
                showResult('complete-result', 'Step 3: Testing login...', 'info');
                const loginResult = await AuthService.login(email, newPassword, 'student');
                
                showResult('complete-result', `🎉 COMPLETE FLOW SUCCESSFUL!\n\n✅ OTP Generated: ${otp}\n✅ Password Reset: ${newPassword}\n✅ Login Successful\n\nUser: ${loginResult.user.name}\nEmail: ${loginResult.user.email}\nRole: ${loginResult.user.role}`, 'success');
                
            } catch (error) {
                showResult('complete-result', `❌ Flow failed: ${error.message}`, 'error');
            }
        }
        
        // Initialize with demo email
        document.addEventListener('DOMContentLoaded', () => {
            document.getElementById('test-email').value = 'student@example.com';
            console.log('Forgot Password Test Page Loaded');
            console.log('Ready to test password reset functionality');
        });
    </script>
</body>
</html>
